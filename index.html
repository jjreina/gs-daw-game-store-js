<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameZone | Catálogo de videojuegos</title>
  </head>

  <body>
    <div id="app">
      <header class="header">
        <div class="container">
          <h1>GameZone</h1>
          <p>Catálogo de videojuegos</p>
        </div>
      </header>

      <main class="container">
        <section class="catalog-header">
          <div>
            <h2>Catálogo de videojuegos</h2>
            <p>Explora nuestra colección de videojuegos.</p>
          </div>

          <div class="filters">
            <div class="filter-group">
              <label for="genre-filter">Filtrar por género</label>

              <select>
                <option value="all">Todos los géneros</option>
                <option value="Aventura">Aventura</option>
                <option value="Simulación">Simulación</option>
                <option value="Puzles">Puzles</option>
                <option value="Plataformas">Plataformas</option>
                <option value="Sandbox">Sandbox</option>
                <option value="Acción">Acción</option>
                <option value="Rol">Rol</option>
                <option value="Estrategia">Estrategia</option>
              </select>
            </div>
          </div>
        </section>

        <!-- Contenedor donde se insertarán las tarjetas -->
        <section id="games-container" class="games-grid"></section>
      </main>

      <footer class="footer">
        <div class="container">
          <p>GameZone - Desarrollo Web en Entorno Cliente</p>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
